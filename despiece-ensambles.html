<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Despiece de Ensambles — AMBIENTES EXTREMOS</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ---- Paleta navy del Portal de Clientes (2026-09-18, admin.html /
     proyecto-detalle.html / dashboard.html / vista-cliente.html) — a este
     archivo nunca se le había aplicado, se queda corto arreglarlo ahora.
     Mismas variables, mismo mecanismo: redefine lo que ya usaba el tema
     "content-light" y todas las reglas "body.content-light ..." de abajo
     cambian de gris claro a navy sin reescribirlas una por una. */
  :root {
    --paper-900: #0f1c30;
    --paper-800: #16273f;
    --paper-border: #28405f;
    --ink-900: #eef2f6;
    --ink-600: #93a8c2;
    --p-input-bg: #1c3352;
    --p-blue: #3e7bfa;
    --p-blue-dim: rgba(62,123,250,0.16);
  }

  .admin-header { padding: 24px 48px; border-bottom: 1px solid var(--gunmetal-700); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .admin-header h1 { font-size: 22px; font-weight: 600; }
  .tools-back-link { display: inline-block; font-size: 12.5px; color: var(--steel-300); text-decoration: none; margin-bottom: 6px; }
  .tools-back-link:hover { color: var(--orange); }
  .admin-header-right { display: flex; align-items: center; gap: 16px; }
  .staff-identity { font-size: 13px; color: var(--steel-300); text-align: right; }
  .staff-identity strong { color: var(--white); font-weight: 600; }
  body.content-light .staff-identity { color: var(--ink-600); }
  body.content-light .staff-identity strong { color: var(--ink-900); }
  .logout-btn { background: transparent; border: 1px solid var(--gunmetal-600); color: var(--steel-100); font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 10px 18px; border-radius: 3px; cursor: pointer; }
  .logout-btn:hover { border-color: var(--orange); color: var(--orange); }

  .admin-content { padding: 32px 48px 64px; max-width: 1220px; margin: 0 auto; }
  .denied { text-align: center; padding: 100px 24px; color: var(--steel-300); }

  .panel { background: var(--gunmetal-800); border: 1px solid var(--gunmetal-700); border-radius: 6px; padding: 28px 30px; margin-bottom: 28px; }
  .panel h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .panel .panel-sub { font-size: 13px; color: var(--steel-300); margin-bottom: 18px; }

  /* Las pestañas son navegación — les toca el azul estructural, mismo
     criterio que el quick-nav de admin.html (el naranja se queda para
     botones de acción como "Guardar"). */
  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab-btn { font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; color: var(--steel-100); background: var(--gunmetal-800); border: 1px solid var(--gunmetal-600); border-radius: 20px; padding: 9px 18px; cursor: pointer; }
  .tab-btn.active { background: var(--p-blue); border-color: var(--p-blue); color: var(--white); }
  body.content-light .tab-btn { background: var(--paper-800); border-color: var(--paper-border); color: var(--ink-600); }
  body.content-light .tab-btn.active { background: var(--p-blue); border-color: var(--p-blue); color: var(--white); }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .form-row.single { grid-template-columns: 1fr; }
  .form-row.triple { grid-template-columns: 1fr 1fr 1fr; }
  .field label { display: block; font-size: 12px; color: var(--steel-300); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; background: var(--gunmetal-900); border: 1px solid var(--gunmetal-600); color: var(--white); font-family: 'Inter', sans-serif; font-size: 14px; padding: 10px 12px; border-radius: 3px; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--orange); }
  /* Todos los valores se capturan a mano — sin flechas de subir/bajar,
     para no dar la impresión de que algún campo se calcula o incrementa
     solo (pedido explícito de Ric, 2026-09-21). */
  .field input[type="number"]::-webkit-outer-spin-button,
  .field input[type="number"]::-webkit-inner-spin-button,
  .comp-table input[type="number"]::-webkit-outer-spin-button,
  .comp-table input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .field input[type="number"], .comp-table input[type="number"] { -moz-appearance: textfield; }
  .field-note { font-size: 11px; color: var(--steel-300); margin-top: 5px; }

  .submit-btn { background: var(--orange); color: var(--white); border: none; font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 11px 22px; border-radius: 3px; cursor: pointer; margin-top: 6px; }
  .submit-btn:hover { background: #d0531a; }
  .cancel-btn { background: transparent; color: var(--steel-300); border: 1px solid var(--gunmetal-600); font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 11px 22px; border-radius: 3px; cursor: pointer; margin-top: 6px; margin-left: 10px; }
  .cancel-btn.danger { color: #e05a5a; border-color: #e05a5a; }

  .msg { font-size: 13px; padding: 10px 14px; border-radius: 4px; margin-bottom: 14px; display: none; }
  .msg.success { background: rgba(60,180,100,0.12); border: 1px solid #2ecc71; color: #7fe0a5; display: block; }
  .msg.error { background: rgba(220,60,60,0.12); border: 1px solid #c0392b; color: #ff8a8a; display: block; }

  .empty-note { font-size: 13px; color: var(--steel-300); padding: 8px 0; }
  .hidden { display: none !important; }
  .verifying-note { color: var(--steel-300); }

  /* Panel de compras / ensambles — tablas de componentes */
  .comp-table-scroll { overflow-x: auto; }
  .comp-table { width: 100%; border-collapse: collapse; min-width: 1280px; }
  .comp-table td input, .comp-table td select { min-width: 78px; }
  .comp-total-row { text-align: right; font-size: 14px; font-weight: 600; padding: 12px 10px 4px; }
  .assembly-summary { background: var(--gunmetal-900); border: 1px solid var(--orange); border-radius: 4px; padding: 14px 16px; margin-bottom: 18px; }
  .assembly-summary .as-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .assembly-summary .as-meta { font-size: 13px; color: var(--steel-300); }
  .assembly-summary .qa { margin-left: 12px; }
  body.content-light .assembly-summary { background: var(--paper-800); }
  body.content-light .assembly-summary .as-meta { color: var(--ink-600); }
  .comp-table th { text-align: left; font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--steel-300); padding: 8px 10px; border-bottom: 1px solid var(--gunmetal-600); }
  .comp-table td { padding: 8px 10px; border-bottom: 1px solid var(--gunmetal-700); font-size: 13px; vertical-align: middle; }
  .comp-table td .r-main { font-weight: 600; }
  .comp-table td .r-meta { font-size: 11.5px; color: var(--steel-300); }
  .comp-table select, .comp-table input { width: 100%; background: var(--gunmetal-900); border: 1px solid var(--gunmetal-600); color: var(--white); font-family: 'Inter', sans-serif; font-size: 13px; padding: 6px 8px; border-radius: 3px; }
  .comp-table .qa { font-size: 12px; font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.03em; color: var(--orange); cursor: pointer; text-decoration: none; white-space: nowrap; margin-right: 10px; }
  .comp-table .qa.danger { color: #e05a5a; }
  .status-pill-sm { font-family: 'Oswald', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; padding: 3px 9px; border-radius: 12px; background: var(--orange-dim); border: 1px solid var(--orange); color: var(--orange); white-space: nowrap; }
  .status-pill-sm.recibido { background: rgba(60,180,100,0.14); border-color: #2ecc71; color: #7fe0a5; }
  body.content-light .status-pill-sm.recibido { color: #1f7a45; }

  .row-item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 12px 0; border-bottom: 1px solid var(--gunmetal-700); font-size: 14px; cursor: pointer; }
  .row-item:last-child { border-bottom: none; }
  .row-item .r-main { font-weight: 600; }
  .row-item .r-meta { font-size: 12px; color: var(--steel-300); }
  .row-item:hover { border-color: var(--orange); }

  .ensamble-summary { background: var(--gunmetal-900); border: 1px solid var(--gunmetal-700); border-radius: 4px; padding: 14px 16px; margin-bottom: 18px; font-size: 13px; }
  .ensamble-summary .es-name { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .ensamble-summary .es-meta { color: var(--steel-300); }

  body.content-light .admin-header { border-color: var(--paper-border); }
  body.content-light .admin-header h1 { color: var(--ink-900); }
  body.content-light .tools-back-link { color: var(--ink-600); }
  body.content-light .tools-back-link:hover { color: var(--orange); }
  body.content-light .logout-btn { border-color: var(--paper-border); color: var(--ink-600); }
  body.content-light .denied { color: var(--ink-600); }
  body.content-light .panel { background: var(--paper-800); border-color: var(--paper-border); }
  body.content-light .panel h2 { color: var(--ink-900); }
  body.content-light .panel .panel-sub { color: var(--ink-600); }
  body.content-light .field label { color: var(--ink-600); }
  body.content-light .field input, body.content-light .field select { background: var(--p-input-bg); border-color: var(--paper-border); color: var(--ink-900); }
  body.content-light .field-note { color: var(--ink-600); }
  body.content-light .cancel-btn { border-color: var(--paper-border); color: var(--ink-600); }
  body.content-light .msg.success { color: #1f7a45; }
  body.content-light .msg.error { color: #a63232; }
  body.content-light .empty-note { color: var(--ink-600); }
  body.content-light .verifying-note { color: var(--ink-600); }
  body.content-light .comp-table th { color: var(--ink-600); border-color: var(--paper-border); }
  body.content-light .comp-table td { border-color: var(--paper-border); }
  body.content-light .comp-table td .r-meta { color: var(--ink-600); }
  body.content-light .comp-table select, body.content-light .comp-table input { background: var(--p-input-bg); border-color: var(--paper-border); color: var(--ink-900); }
  body.content-light .row-item { border-color: var(--paper-border); }
  body.content-light .row-item .r-meta { color: var(--ink-600); }
  body.content-light .ensamble-summary { background: var(--paper-800); border-color: var(--paper-border); }
  body.content-light .ensamble-summary .es-meta { color: var(--ink-600); }
</style>
</head>
<body class="content-light">

<header>
  <a class="logo" href="index.html">AMBIENTES <span>EXTREMOS</span></a>
  <nav>
    <ul>
      <li><a href="sensores.html">Sensores</a></li>
      <li><a href="ensambles.html">Ensambles</a></li>
      <li><a href="cables.html">Cables</a></li>
      <li><a href="protecciones.html">Protecciones</a></li>
      <li><a href="index.html#contacto">Contacto</a></li>
    </ul>
  </nav>
</header>

<div class="admin-header">
  <div>
    <a class="tools-back-link" href="herramientas.html">← Volver a Herramientas</a>
    <h1>Despiece de Ensambles</h1>
  </div>
  <div class="admin-header-right">
    <span class="staff-identity" id="staffIdentity"></span>
    <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
  </div>
</div>

<div class="admin-content" id="adminContent">
  <p class="verifying-note">Verificando acceso...</p>
</div>

<script src="portal-config.js"></script>
<script>
  const adminContent = document.getElementById('adminContent');
  const PROVIDER_NEW_VALUE = '__new__';

  // Estatus de compra de cada componente — mismo flujo de 5 pasos
  // confirmado con Ric el 2026-09-21.
  const COMPONENT_STATUS_ORDER = ['cotizar', 'programar_pago', 'pago_programado', 'en_transito', 'disponible'];
  const COMPONENT_STATUS_LABELS = {
    cotizar: 'Cotizar',
    programar_pago: 'Programar pago',
    pago_programado: 'Pago programado',
    en_transito: 'En tránsito',
    disponible: 'Disponible',
  };
  function componentStatusOptionsHtml(selected) {
    return COMPONENT_STATUS_ORDER.map(s => `<option value="${s}"${s === selected ? ' selected' : ''}>${COMPONENT_STATUS_LABELS[s]}</option>`).join('');
  }

  let currentRole = null; // 'admin' | 'vendedor'
  let currentStaffId = null;
  let providersCache = []; // catálogo de proveedores editable — reemplaza el enum fijo (2026-09-21)
  let assembliesCache = []; // catálogo de diseños de ensamble reutilizables
  let projectsCache = []; // solo id/assembly_id/status — para "Pedidos activos"
  let componentsCache = []; // TODOS los componentes de TODOS los ensambles, con su ensamble embebido
  let activeTab = 'ensambles'; // 'ensambles' | 'compras'
  let openAssemblyId = null; // ensamble abierto en "Todos los ensambles"
  let showingNewAssemblyForm = false;
  let newAssemblyDrafts = []; // filas de componentes al crear un ensamble nuevo
  let addCompDrafts = []; // filas de componentes nuevos para un ensamble ya existente

  function setStaffIdentity(label) {
    const el = document.getElementById('staffIdentity');
    if (el) el.innerHTML = label;
  }

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'portal.html'; return; }
    currentStaffId = session.user.id;
    const sessionEmail = session.user.email || '';

    const { data: adminRow } = await supabaseClient.from('portal_admins').select('id, active').eq('id', currentStaffId).single();
    if (adminRow) {
      if (adminRow.active === false) { await denyInactive(); return; }
      currentRole = 'admin';
      setStaffIdentity(`<strong>${escapeHtml(sessionEmail)}</strong> — Administrador`);
      await loadAll();
      renderShell();
      return;
    }

    const { data: vendedorRow } = await supabaseClient.from('portal_vendedores').select('id, full_name, active').eq('id', currentStaffId).single();
    if (vendedorRow) {
      if (vendedorRow.active === false) { await denyInactive(); return; }
      currentRole = 'vendedor';
      setStaffIdentity(`<strong>${escapeHtml(vendedorRow.full_name)}</strong> — Vendedor`);
      await loadAll();
      renderShell();
      return;
    }

    adminContent.innerHTML = '<div class="denied">Esta cuenta no tiene permisos en Herramientas.</div>';
  }

  async function denyInactive() {
    await supabaseClient.auth.signOut();
    window.location.href = 'portal.html?inactive=1';
  }

  async function loadAll() {
    const { data: providers } = await supabaseClient.from('portal_providers').select('id, name, active').order('name');
    providersCache = providers || [];

    const { data: assemblies } = await supabaseClient.from('portal_assemblies').select('id, name, part_number, sale_price, active').order('name');
    assembliesCache = assemblies || [];

    // Solo lo mínimo para calcular "Pedidos activos" — un vendedor solo ve
    // (vía RLS) sus propios proyectos, así que para él este número refleja
    // solo lo suyo; un administrador ve el total real de toda la empresa.
    const { data: projects } = await supabaseClient.from('portal_projects').select('id, assembly_id, status');
    projectsCache = projects || [];

    await reloadComponents();
  }

  async function reloadComponents() {
    const { data } = await supabaseClient
      .from('portal_assembly_components')
      .select('id, assembly_id, component_name, part_number, quantity, unit, unit_cost, total_cost, provider_id, moq, lead_time, availability, status, po_number_component, supplier_commitment_date, order_index, portal_assemblies(id, name, part_number)')
      .order('created_at', { ascending: true });
    componentsCache = data || [];
  }

  // Cuántos proyectos "en curso" (no entregados) usan el mismo diseño de
  // ensamble — el "Pedidos activos" que Ric ya lleva a mano en Excel.
  function activeOrdersForAssembly(assemblyId) {
    return projectsCache.filter(p => p.assembly_id === assemblyId && p.status !== 'entregado').length;
  }

  function assemblyComponentCount(assemblyId) {
    return componentsCache.filter(c => c.assembly_id === assemblyId).length;
  }

  function formatCurrency(n) {
    if (n === null || n === undefined || n === '') return '';
    const num = Number(n);
    if (isNaN(num)) return '';
    return num.toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  }

  // ---- Proveedores: catálogo editable compartido en todo el portal.
  // Cualquier select de proveedor incluye "+ Agregar proveedor nuevo…" —
  // al elegirlo se crea de inmediato y queda disponible aquí y en
  // Administración de Proyectos (Proveedores por pedido). ----
  function providerSelectHtml(fieldKey, selected) {
    return `<select data-provider-field="${fieldKey}">` +
      '<option value="">Sin definir</option>' +
      providersCache.map(p => `<option value="${p.id}"${p.id === selected ? ' selected' : ''}>${escapeHtml(p.name)}</option>`).join('') +
      `<option value="${PROVIDER_NEW_VALUE}">+ Agregar proveedor nuevo…</option>` +
      '</select>';
  }

  function wireProviderSelect(selectEl, onSelect) {
    if (!selectEl) return;
    selectEl.addEventListener('change', async (e) => {
      if (e.target.value === PROVIDER_NEW_VALUE) {
        const name = (prompt('Nombre del proveedor nuevo:') || '').trim();
        if (!name) { e.target.value = ''; return; }
        const { data, error } = await supabaseClient.from('portal_providers').insert({ name }).select('id, name, active').single();
        if (error) {
          alert('No se pudo crear el proveedor: ' + error.message);
          e.target.value = '';
          return;
        }
        providersCache.push(data);
        providersCache.sort((a, b) => a.name.localeCompare(b.name, 'es'));
        onSelect(data.id);
        return;
      }
      onSelect(e.target.value || null);
    });
  }

  function blankComponentDraft() {
    return { component_name: '', part_number: '', quantity: 1, unit: '', unit_cost: '', total_cost: '', provider_id: '', moq: '', lead_time: '', availability: '', status: 'cotizar', po_number_component: '', supplier_commitment_date: '' };
  }

  function componentDraftToPayload(r, assemblyId) {
    return {
      assembly_id: assemblyId,
      component_name: r.component_name.trim(),
      part_number: (r.part_number || '').trim() || null,
      quantity: r.quantity === '' || r.quantity === null || r.quantity === undefined ? 1 : (Number(r.quantity) || 1),
      unit: (r.unit || '').trim() || null,
      unit_cost: r.unit_cost === '' || r.unit_cost === null || r.unit_cost === undefined ? null : Number(r.unit_cost),
      total_cost: r.total_cost === '' || r.total_cost === null || r.total_cost === undefined ? null : Number(r.total_cost),
      provider_id: r.provider_id || null,
      moq: r.moq === '' || r.moq === null || r.moq === undefined ? null : Number(r.moq),
      lead_time: (r.lead_time || '').trim() || null,
      availability: (r.availability || '').trim() || null,
      status: r.status || 'cotizar',
      po_number_component: r.po_number_component || null,
      supplier_commitment_date: r.supplier_commitment_date || null,
    };
  }

  async function updateComponentField(componentId, field, value) {
    const { error } = await supabaseClient.from('portal_assembly_components').update({ [field]: value }).eq('id', componentId);
    if (!error) {
      const c = componentsCache.find(c => c.id === componentId);
      if (c) c[field] = value;
    }
  }

  function renderShell() {
    adminContent.innerHTML = `
      <div class="tabs">
        <button type="button" class="tab-btn" data-tab="ensambles">Todos los ensambles</button>
        <button type="button" class="tab-btn" data-tab="compras">Panel de compras</button>
      </div>
      <div id="tabContent"></div>
    `;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => { activeTab = btn.getAttribute('data-tab'); renderTabs(); });
    });
    renderTabs();
  }

  function renderTabs() {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.getAttribute('data-tab') === activeTab));
    if (activeTab === 'compras') renderComprasTab();
    else renderEnsamblesTab();
  }

  // =====================================================================
  // Pestaña 1 — Todos los ensambles: el catálogo completo. Cada diseño se
  // da de alta aquí, con TODOS sus componentes, antes de poder ligarlo a
  // un pedido (eso se hace desde Administración de Proyectos).
  // =====================================================================
  function renderEnsamblesTab() {
    const wrap = document.getElementById('tabContent');
    wrap.innerHTML = `
      <div class="panel">
        <h2>Todos los ensambles</h2>
        <p class="panel-sub">El catálogo completo de diseños de ensamble — cada uno con sus componentes, costos, proveedor y estatus de compra. Los pedidos se ligan a estos diseños ya existentes desde Administración de Proyectos.</p>
        <div class="form-row single" style="margin-bottom:4px;">
          <div class="field"><label>Buscar (nombre o NP)</label><input type="text" id="asmSearchText" placeholder="Ej. Walther Nuevo Recto"></div>
        </div>
        <div id="assembliesListWrap" style="margin-top:14px;"></div>
        <button type="button" class="cancel-btn" id="newAssemblyBtn" style="margin-left:0; margin-top:14px;">+ Cargar nuevo ensamble</button>
      </div>
      <div id="newAssemblyFormWrap"></div>
      <div id="assemblyDetailWrap"></div>
    `;
    document.getElementById('asmSearchText').addEventListener('input', renderAssembliesList);
    document.getElementById('newAssemblyBtn').addEventListener('click', () => {
      showingNewAssemblyForm = true;
      openAssemblyId = null;
      newAssemblyDrafts = [blankComponentDraft()];
      renderNewAssemblyForm();
      renderAssemblyDetail();
      setTimeout(() => { const f = document.getElementById('newAssemblyFormWrap'); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 0);
    });
    renderAssembliesList();
    renderNewAssemblyForm();
    renderAssemblyDetail();
  }

  function renderAssembliesList() {
    const wrap = document.getElementById('assembliesListWrap');
    if (!wrap) return;
    const textEl = document.getElementById('asmSearchText');
    const text = textEl ? textEl.value.trim().toLowerCase() : '';
    const list = assembliesCache.filter(a => {
      if (!text) return true;
      return [a.name, a.part_number].filter(Boolean).join(' ').toLowerCase().includes(text);
    });
    if (list.length === 0) {
      wrap.innerHTML = `<p class="empty-note">${assembliesCache.length === 0 ? 'Todavía no hay ningún ensamble dado de alta — usa "+ Cargar nuevo ensamble".' : 'Ningún ensamble coincide con la búsqueda.'}</p>`;
      return;
    }
    wrap.innerHTML = list.map(a => `
      <div class="row-item" data-open-assembly="${a.id}">
        <span class="r-main">${escapeHtml(a.name)}</span>
        <span class="r-meta">${a.part_number ? 'NP ' + escapeHtml(a.part_number) : 'Sin NP'} — ${assemblyComponentCount(a.id)} componente(s) — Pedidos activos: ${activeOrdersForAssembly(a.id)}${a.sale_price !== null && a.sale_price !== undefined ? ' — Precio: ' + formatCurrency(a.sale_price) : ''}</span>
      </div>
    `).join('');
    list.forEach(a => {
      wrap.querySelector(`[data-open-assembly="${a.id}"]`).addEventListener('click', () => {
        openAssemblyId = a.id;
        showingNewAssemblyForm = false;
        renderNewAssemblyForm();
        renderAssemblyDetail();
        setTimeout(() => { const d = document.getElementById('assemblyDetailWrap'); if (d) d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 0);
      });
    });
  }

  // ---- Cargar ensamble nuevo: Nombre + NP + Precio, y hay que cargar al
  // menos un componente para poder guardar. ----
  function renderNewAssemblyForm() {
    const wrap = document.getElementById('newAssemblyFormWrap');
    if (!wrap) return;
    if (!showingNewAssemblyForm) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = `
      <div class="panel">
        <h2>Cargar nuevo ensamble</h2>
        <p class="panel-sub">Captura el diseño y TODOS sus componentes — para guardar necesitas al menos uno con nombre.</p>
        <div id="newAsmMsg" class="msg"></div>
        <div class="form-row triple">
          <div class="field"><label>Nombre del ensamble</label><input type="text" id="newAsmName" placeholder="Ej. Walther Nuevo Recto"></div>
          <div class="field"><label>Número de parte (NP)</label><input type="text" id="newAsmNP" placeholder="Ej. RG-W7C20-H"></div>
          <div class="field"><label>Precio de venta (opcional)</label><input type="number" step="any" id="newAsmPrice" placeholder="Ej. 4650"></div>
        </div>
        <label style="display:block; font-size:12px; color: var(--steel-300); margin: 18px 0 8px;">Componentes — captura todos los valores a mano (costo unitario y costo total no se calculan solos)</label>
        <div id="newAsmCompWrap"></div>
        <button type="button" class="cancel-btn" id="newAsmAddCompBtn" style="margin-left:0;">+ Agregar componente</button>
        <div style="margin-top:18px;">
          <button type="button" class="submit-btn" id="newAsmSaveBtn">Guardar ensamble</button>
          <button type="button" class="cancel-btn" id="newAsmCancelBtn">Cancelar</button>
        </div>
      </div>
    `;
    document.getElementById('newAsmAddCompBtn').addEventListener('click', () => {
      newAssemblyDrafts.push(blankComponentDraft());
      renderNewAsmCompRows();
    });
    document.getElementById('newAsmSaveBtn').addEventListener('click', saveNewAssembly);
    document.getElementById('newAsmCancelBtn').addEventListener('click', () => {
      showingNewAssemblyForm = false;
      renderNewAssemblyForm();
    });
    renderNewAsmCompRows();
  }

  // Misma tabla ancha (.comp-table, con scroll horizontal) que usan el
  // Panel de compras y los componentes ya existentes — antes estas filas
  // usaban un .form-row angosto que apretaba 14 campos dentro del ancho
  // del panel; Ric pidió que aprovechara el ancho de pantalla y mantuviera
  // el mismo formato del resto del portal (2026-09-21).
  function componentDraftTableHtml(bodyId) {
    return `
      <div class="comp-table-scroll">
      <table class="comp-table">
        <thead><tr><th>Componente</th><th>NP</th><th>Cant.</th><th>Unidad</th><th>Costo</th><th>Costo total</th><th>Proveedor</th><th>MOQ</th><th>TE</th><th>Disponible</th><th>Estatus</th><th>PO</th><th>Compromiso proveedor</th><th></th></tr></thead>
        <tbody id="${bodyId}"></tbody>
      </table>
      </div>
    `;
  }

  function componentDraftRowHtml(prefix, i, row) {
    return `
      <tr>
        <td><input type="text" data-${prefix}-name="${i}" value="${escapeHtml(row.component_name)}" placeholder="Ej. Motor 3 HP"></td>
        <td><input type="text" data-${prefix}-np="${i}" value="${escapeHtml(row.part_number || '')}"></td>
        <td><input type="number" step="any" data-${prefix}-qty="${i}" value="${row.quantity ?? 1}"></td>
        <td><input type="text" data-${prefix}-unit="${i}" value="${escapeHtml(row.unit || '')}" placeholder="Ej. pza"></td>
        <td><input type="number" step="any" data-${prefix}-cost="${i}" value="${row.unit_cost ?? ''}"></td>
        <td><input type="number" step="any" data-${prefix}-total="${i}" value="${row.total_cost ?? ''}"></td>
        <td>${providerSelectHtml(prefix + '-provider-' + i, row.provider_id)}</td>
        <td><input type="number" step="any" data-${prefix}-moq="${i}" value="${row.moq ?? ''}"></td>
        <td><input type="text" data-${prefix}-te="${i}" value="${escapeHtml(row.lead_time || '')}" placeholder="Ej. 15 días"></td>
        <td><input type="text" data-${prefix}-disp="${i}" value="${escapeHtml(row.availability || '')}" placeholder="Ej. 3 en stock"></td>
        <td><select data-${prefix}-status="${i}">${componentStatusOptionsHtml(row.status)}</select></td>
        <td><input type="text" data-${prefix}-po="${i}" value="${escapeHtml(row.po_number_component)}" placeholder="OC-..."></td>
        <td><input type="date" data-${prefix}-date="${i}" value="${row.supplier_commitment_date || ''}"></td>
        <td><a class="qa danger" data-${prefix}-remove="${i}">Quitar</a></td>
      </tr>
    `;
  }

  function wireComponentDraftRow(prefix, i, body, drafts, rerender) {
    body.querySelector(`[data-${prefix}-name="${i}"]`).addEventListener('input', e => { drafts[i].component_name = e.target.value; });
    body.querySelector(`[data-${prefix}-np="${i}"]`).addEventListener('input', e => { drafts[i].part_number = e.target.value; });
    body.querySelector(`[data-${prefix}-qty="${i}"]`).addEventListener('input', e => { drafts[i].quantity = e.target.value; });
    body.querySelector(`[data-${prefix}-unit="${i}"]`).addEventListener('input', e => { drafts[i].unit = e.target.value; });
    body.querySelector(`[data-${prefix}-cost="${i}"]`).addEventListener('input', e => { drafts[i].unit_cost = e.target.value; });
    body.querySelector(`[data-${prefix}-total="${i}"]`).addEventListener('input', e => { drafts[i].total_cost = e.target.value; });
    wireProviderSelect(body.querySelector(`[data-provider-field="${prefix}-provider-${i}"]`), (id) => { drafts[i].provider_id = id; rerender(); });
    body.querySelector(`[data-${prefix}-moq="${i}"]`).addEventListener('input', e => { drafts[i].moq = e.target.value; });
    body.querySelector(`[data-${prefix}-te="${i}"]`).addEventListener('input', e => { drafts[i].lead_time = e.target.value; });
    body.querySelector(`[data-${prefix}-disp="${i}"]`).addEventListener('input', e => { drafts[i].availability = e.target.value; });
    body.querySelector(`[data-${prefix}-status="${i}"]`).addEventListener('change', e => { drafts[i].status = e.target.value; });
    body.querySelector(`[data-${prefix}-po="${i}"]`).addEventListener('input', e => { drafts[i].po_number_component = e.target.value; });
    body.querySelector(`[data-${prefix}-date="${i}"]`).addEventListener('change', e => { drafts[i].supplier_commitment_date = e.target.value; });
    body.querySelector(`[data-${prefix}-remove="${i}"]`).addEventListener('click', () => { drafts.splice(i, 1); rerender(); });
  }

  function renderNewAsmCompRows() {
    const wrap = document.getElementById('newAsmCompWrap');
    if (!wrap) return;
    wrap.innerHTML = componentDraftTableHtml('newAsmCompBody');
    const body = document.getElementById('newAsmCompBody');
    body.innerHTML = newAssemblyDrafts.map((row, i) => componentDraftRowHtml('na', i, row)).join('');
    newAssemblyDrafts.forEach((row, i) => wireComponentDraftRow('na', i, body, newAssemblyDrafts, renderNewAsmCompRows));
  }

  async function saveNewAssembly() {
    const msg = document.getElementById('newAsmMsg');
    const name = document.getElementById('newAsmName').value.trim();
    const np = document.getElementById('newAsmNP').value.trim();
    const priceEl = document.getElementById('newAsmPrice');
    const price = priceEl.value !== '' ? Number(priceEl.value) : null;

    if (!name) {
      msg.className = 'msg error';
      msg.textContent = 'Falta el nombre del ensamble.';
      return;
    }
    const rows = newAssemblyDrafts.filter(r => r.component_name && r.component_name.trim());
    if (rows.length === 0) {
      msg.className = 'msg error';
      msg.textContent = 'Para guardar un ensamble nuevo hay que cargar al menos un componente con nombre.';
      return;
    }
    if (rows.some(r => r.po_number_component && !r.provider_id)) {
      msg.className = 'msg error';
      msg.textContent = 'Falta elegir el proveedor en algún componente que ya tiene PO capturada.';
      return;
    }

    const { data: asm, error: asmError } = await supabaseClient.from('portal_assemblies').insert({
      name, part_number: np || null, sale_price: price,
    }).select('id, name, part_number, sale_price, active').single();

    if (asmError) {
      msg.className = 'msg error';
      msg.textContent = 'Error al crear el ensamble: ' + asmError.message;
      return;
    }

    const payload = rows.map(r => componentDraftToPayload(r, asm.id));
    const { error: compError } = await supabaseClient.from('portal_assembly_components').insert(payload);
    if (compError) {
      msg.className = 'msg error';
      msg.textContent = 'El ensamble se creó, pero hubo un error al guardar sus componentes: ' + compError.message;
      return;
    }

    assembliesCache.push(asm);
    assembliesCache.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    await reloadComponents();
    showingNewAssemblyForm = false;
    openAssemblyId = asm.id;
    renderAssembliesList();
    renderNewAssemblyForm();
    renderAssemblyDetail();
    renderComprasTableIfVisible();
  }

  // ---- Detalle de un ensamble ya existente: editar Nombre/NP/Precio y
  // administrar sus componentes (misma tabla editable en vivo). ----
  function renderAssemblyDetail() {
    const wrap = document.getElementById('assemblyDetailWrap');
    if (!wrap) return;
    if (!openAssemblyId || showingNewAssemblyForm) { wrap.innerHTML = ''; return; }
    const a = assembliesCache.find(x => x.id === openAssemblyId);
    if (!a) { wrap.innerHTML = ''; return; }

    addCompDrafts = [];
    const activos = activeOrdersForAssembly(a.id);
    wrap.innerHTML = `
      <div class="panel">
        <h2>${escapeHtml(a.name)}</h2>
        <p class="panel-sub">Pedidos activos que usan este diseño: ${activos}. La compra y el estatus de estos componentes son compartidos — aplican para todos los pedidos que usen este mismo diseño, no solo uno.</p>
        <div id="asmDetailMsg" class="msg"></div>
        <div class="form-row triple">
          <div class="field"><label>Nombre del ensamble</label><input type="text" id="asmEditName" value="${escapeHtml(a.name)}"></div>
          <div class="field"><label>Número de parte (NP)</label><input type="text" id="asmEditNP" value="${escapeHtml(a.part_number || '')}"></div>
          <div class="field"><label>Precio de venta (opcional)</label><input type="number" step="any" id="asmEditPrice" value="${a.sale_price ?? ''}"></div>
        </div>
        <button type="button" class="cancel-btn" id="asmEditSaveBtn" style="margin-left:0;">Guardar cambios del ensamble</button>
        <div id="existingAsmCompWrap" style="margin-top:22px;"></div>
        <div id="asmCompTotalWrap"></div>
        <div id="newAsmCompMsg" class="msg"></div>
        <div id="addAsmCompWrap" style="margin-top:10px;"></div>
        <button type="button" class="cancel-btn" id="addAsmCompBtn" style="margin-left:0;">+ Agregar componente</button>
        <button type="button" class="submit-btn hidden" id="saveAddAsmCompBtn" style="margin-left:10px;">Guardar nuevos componentes</button>
        <button type="button" class="cancel-btn" id="closeAsmDetailBtn" style="margin-left:10px;">Cerrar</button>
        ${currentRole === 'admin' ? '<button type="button" class="cancel-btn danger" id="deleteAsmBtn" style="margin-left:10px;">Eliminar ensamble</button>' : ''}
      </div>
    `;
    document.getElementById('asmEditSaveBtn').addEventListener('click', () => saveAssemblyHeader(a.id));
    document.getElementById('addAsmCompBtn').addEventListener('click', () => {
      addCompDrafts.push(blankComponentDraft());
      renderAddAsmCompRows(a.id);
    });
    document.getElementById('saveAddAsmCompBtn').addEventListener('click', () => saveAddAsmComponents(a.id));
    document.getElementById('closeAsmDetailBtn').addEventListener('click', () => {
      openAssemblyId = null;
      renderAssemblyDetail();
    });
    const deleteBtn = document.getElementById('deleteAsmBtn');
    if (deleteBtn) deleteBtn.addEventListener('click', () => deleteAssembly(a.id));
    renderExistingAsmComponents(a.id);
    renderAddAsmCompRows(a.id);
  }

  async function deleteAssembly(assemblyId) {
    const a = assembliesCache.find(x => x.id === assemblyId);
    if (!a) return;
    const activos = activeOrdersForAssembly(assemblyId);
    const compCount = componentsCache.filter(c => c.assembly_id === assemblyId).length;
    let warning = `¿Eliminar el ensamble "${a.name}" por completo? Se eliminarán también sus ${compCount} componente(s) cargado(s). Esta acción no se puede deshacer.`;
    if (activos > 0) {
      warning += `\n\nAviso: hay ${activos} pedido(s) activo(s) que usan este diseño — no se eliminan los pedidos, pero se quedarán sin diseño ligado.`;
    }
    if (!confirm(warning)) return;
    const msg = document.getElementById('asmDetailMsg');
    const { error } = await supabaseClient.from('portal_assemblies').delete().eq('id', assemblyId);
    if (error) {
      if (msg) { msg.className = 'msg error'; msg.textContent = 'Error al eliminar: ' + error.message; }
      return;
    }
    assembliesCache = assembliesCache.filter(x => x.id !== assemblyId);
    componentsCache = componentsCache.filter(c => c.assembly_id !== assemblyId);
    openAssemblyId = null;
    renderAssembliesList();
    renderAssemblyDetail();
    renderComprasTableIfVisible();
  }

  async function saveAssemblyHeader(assemblyId) {
    const msg = document.getElementById('asmDetailMsg');
    const name = document.getElementById('asmEditName').value.trim();
    const np = document.getElementById('asmEditNP').value.trim();
    const priceEl = document.getElementById('asmEditPrice');
    const price = priceEl.value !== '' ? Number(priceEl.value) : null;
    if (!name) { msg.className = 'msg error'; msg.textContent = 'El nombre no puede quedar vacío.'; return; }
    const { error } = await supabaseClient.from('portal_assemblies').update({ name, part_number: np || null, sale_price: price }).eq('id', assemblyId);
    if (error) { msg.className = 'msg error'; msg.textContent = 'Error: ' + error.message; return; }
    const a = assembliesCache.find(x => x.id === assemblyId);
    if (a) { a.name = name; a.part_number = np || null; a.sale_price = price; }
    msg.className = 'msg success';
    msg.textContent = 'Ensamble actualizado.';
    renderAssembliesList();
  }

  function renderExistingAsmComponents(assemblyId) {
    const wrap = document.getElementById('existingAsmCompWrap');
    const totalWrap = document.getElementById('asmCompTotalWrap');
    if (!wrap) return;
    const rows = componentsCache.filter(c => c.assembly_id === assemblyId);
    if (rows.length === 0) {
      wrap.innerHTML = '<p class="empty-note">Ningún componente cargado todavía para este ensamble.</p>';
      if (totalWrap) totalWrap.innerHTML = '';
      return;
    }
    wrap.innerHTML = `
      <div class="comp-table-scroll">
      <table class="comp-table">
        <thead><tr><th>Componente</th><th>NP</th><th>Cant.</th><th>Unidad</th><th>Costo</th><th>Costo total</th><th>Proveedor</th><th>MOQ</th><th>TE</th><th>Disponible</th><th>Estatus</th><th>PO</th><th>Compromiso proveedor</th>${currentRole === 'admin' ? '<th></th>' : ''}</tr></thead>
        <tbody id="existingAsmCompBody"></tbody>
      </table>
      </div>
    `;
    const body = document.getElementById('existingAsmCompBody');
    body.innerHTML = rows.map(c => `
      <tr>
        <td><span class="r-main">${escapeHtml(c.component_name)}</span></td>
        <td><input type="text" data-ac-np="${c.id}" value="${escapeHtml(c.part_number || '')}"></td>
        <td><input type="number" step="any" data-ac-qty="${c.id}" value="${c.quantity ?? 1}"></td>
        <td><input type="text" data-ac-unit="${c.id}" value="${escapeHtml(c.unit || '')}" placeholder="Ej. pza"></td>
        <td><input type="number" step="any" data-ac-cost="${c.id}" value="${c.unit_cost ?? ''}"></td>
        <td><input type="number" step="any" data-ac-total="${c.id}" value="${c.total_cost ?? ''}"></td>
        <td>${providerSelectHtml('ac-provider-' + c.id, c.provider_id || '')}</td>
        <td><input type="number" step="any" data-ac-moq="${c.id}" value="${c.moq ?? ''}"></td>
        <td><input type="text" data-ac-te="${c.id}" value="${escapeHtml(c.lead_time || '')}" placeholder="Ej. 15 días"></td>
        <td><input type="text" data-ac-disp="${c.id}" value="${escapeHtml(c.availability || '')}" placeholder="Ej. 3 en stock"></td>
        <td><select data-ac-status="${c.id}">${componentStatusOptionsHtml(c.status)}</select></td>
        <td><input type="text" data-ac-po="${c.id}" value="${escapeHtml(c.po_number_component || '')}"></td>
        <td><input type="date" data-ac-date="${c.id}" value="${c.supplier_commitment_date || ''}"></td>
        ${currentRole === 'admin' ? `<td><a class="qa danger" data-ac-remove="${c.id}">Quitar</a></td>` : ''}
      </tr>
    `).join('');
    rows.forEach(c => {
      body.querySelector(`[data-ac-np="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'part_number', e.target.value.trim() || null));
      body.querySelector(`[data-ac-qty="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'quantity', Number(e.target.value) || 0));
      body.querySelector(`[data-ac-unit="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'unit', e.target.value.trim() || null));
      body.querySelector(`[data-ac-cost="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'unit_cost', e.target.value === '' ? null : Number(e.target.value)));
      body.querySelector(`[data-ac-total="${c.id}"]`).addEventListener('change', e => { updateComponentField(c.id, 'total_cost', e.target.value === '' ? null : Number(e.target.value)); renderExistingAsmComponents(assemblyId); renderComprasTableIfVisible(); });
      wireProviderSelect(body.querySelector(`[data-provider-field="ac-provider-${c.id}"]`), (id) => { updateComponentField(c.id, 'provider_id', id); renderExistingAsmComponents(assemblyId); renderComprasTableIfVisible(); });
      body.querySelector(`[data-ac-moq="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'moq', e.target.value === '' ? null : Number(e.target.value)));
      body.querySelector(`[data-ac-te="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'lead_time', e.target.value.trim() || null));
      body.querySelector(`[data-ac-disp="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'availability', e.target.value.trim() || null));
      body.querySelector(`[data-ac-status="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'status', e.target.value));
      body.querySelector(`[data-ac-po="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'po_number_component', e.target.value.trim() || null));

      const removeLink = body.querySelector(`[data-ac-remove="${c.id}"]`);
      if (removeLink) removeLink.addEventListener('click', async () => {

        if (!error) { componentsCache = componentsCache.filter(x => x.id !== c.id); renderExistingAsmComponents(assemblyId); renderComprasTableIfVisible(); renderAssembliesList(); }
      });
    });

      const total = rows.reduce((sum, c) => sum + Number(c.total_cost || 0), 0);

  function renderAddAsmCompRows(assemblyId) {
    const wrap = document.getElementById('addAsmCompWrap');
    const saveBtn = document.getElementById('saveAddAsmCompBtn');
    if (!wrap) return;
    if (addCompDrafts.length === 0) {
      wrap.innerHTML = '';
      if (saveBtn) saveBtn.classList.add('hidden');
      return;
    }
    if (saveBtn) saveBtn.classList.remove('hidden');
    wrap.innerHTML = componentDraftTableHtml('addAsmCompBody');
    const body = document.getElementById('addAsmCompBody');
    body.innerHTML = addCompDrafts.map((row, i) => componentDraftRowHtml('ad', i, row)).join('');
    addCompDrafts.forEach((row, i) => wireComponentDraftRow('ad', i, body, addCompDrafts, () => renderAddAsmCompRows(assemblyId)));
  }

  async function saveAddAsmComponents(assemblyId) {
    const msg = document.getElementById('newAsmCompMsg');
    const rows = addCompDrafts.filter(r => r.component_name && r.component_name.trim());
    if (rows.length === 0) {
      msg.className = 'msg error';
      msg.textContent = 'Agrega al menos un componente con nombre antes de guardar.';
      return;
    }
    if (rows.some(r => r.po_number_component && !r.provider_id)) {
      msg.className = 'msg error';
      msg.textContent = 'Falta elegir el proveedor en alguna fila que ya tiene PO capturada.';
      return;
    }
    const payload = rows.map(r => componentDraftToPayload(r, assemblyId));
    const { error } = await supabaseClient.from('portal_assembly_components').insert(payload);
    if (error) {
      msg.className = 'msg error';
      msg.textContent = 'Error: ' + error.message;
      return;
    }
    msg.className = 'msg success';
    msg.textContent = 'Componentes agregados correctamente.';
    addCompDrafts = [];
    await reloadComponents();
    renderExistingAsmComponents(assemblyId);
    renderAddAsmCompRows(assemblyId);
    renderComprasTableIfVisible();
    renderAssembliesList();
  }

  // =====================================================================
  // Pestaña 2 — Panel de compras: todos los componentes, de todos los
  // ensambles, en una sola vista filtrable. Pensada para responder
  // "¿qué me falta pedir hoy?" sin tener que entrar ensamble por ensamble.
  // =====================================================================
  function renderComprasTab() {
    const wrap = document.getElementById('tabContent');
    wrap.innerHTML = `
      <div class="panel">
        <h2>Panel de compras</h2>
        <p class="panel-sub">Todos los componentes de todos los ensambles. La compra/estatus es compartida entre todos los pedidos que usen el mismo diseño. Edita estatus, proveedor, PO o fecha directo aquí — se guarda al instante.</p>
        <div class="form-row triple" style="margin-bottom:10px;">
          <div class="field"><label>Proveedor</label><select id="compFilterProvider"><option value="">Todos</option>${providersCache.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('')}</select></div>
          <div class="field"><label>Estatus</label><select id="compFilterStatus"><option value="">Todos</option><option value="__pending__">Pendientes (no disponibles)</option>${componentStatusOptionsHtml('')}</select></div>
          <div class="field"><label>Buscar (componente, ensamble, NP, PO)</label><input type="text" id="compFilterText" placeholder="Ej. Motor 3 HP o OC-9010"></div>
        </div>
        <div id="compTableWrap" style="margin-top:14px;"></div>
      </div>
    `;
    ['compFilterProvider', 'compFilterStatus'].forEach(id => document.getElementById(id).addEventListener('change', renderComprasTable));
    document.getElementById('compFilterText').addEventListener('input', renderComprasTable);
    renderComprasTable();
  }

  function filteredComponents() {
    const provider = document.getElementById('compFilterProvider').value;
    const status = document.getElementById('compFilterStatus').value;
    const text = document.getElementById('compFilterText').value.trim().toLowerCase();
    return componentsCache.filter(c => {
      const asm = c.portal_assemblies;
      if (provider && c.provider_id !== provider) return false;
      if (status === '__pending__' && c.status === 'disponible') return false;
      if (status && status !== '__pending__' && c.status !== status) return false;
      if (text) {
        const haystack = [c.component_name, c.part_number, c.po_number_component, asm ? asm.name : '', asm ? asm.part_number : ''].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(text)) return false;
      }
      return true;
    });
  }

  function renderComprasTable() {
    const wrap = document.getElementById('compTableWrap');
    if (!wrap) return;
    if (componentsCache.length === 0) {
      wrap.innerHTML = '<p class="empty-note">Todavía no hay componentes cargados — ve a "Todos los ensambles" para dar de alta el primero.</p>';
      return;
    }
    const list = filteredComponents();
    if (list.length === 0) {
      wrap.innerHTML = '<p class="empty-note">Ningún componente coincide con el filtro.</p>';
      return;
    }
    wrap.innerHTML = `
      <div class="comp-table-scroll">
      <table class="comp-table">
        <thead>
          <tr>
            <th>Componente</th>
            <th>Ensamble</th>
            <th>NP</th>
            <th>Cant.</th>
            <th>Unidad</th>
            <th>Costo</th>
            <th>Costo total</th>
            <th>Proveedor</th>
            <th>MOQ</th>
            <th>TE</th>
            <th>Disponible</th>
            <th>Estatus</th>
            <th>PO</th>
            <th>Compromiso proveedor</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="compTableBody"></tbody>
      </table>
      </div>
    `;
    const body = document.getElementById('compTableBody');
    body.innerHTML = list.map(c => {
      const asm = c.portal_assemblies;
      return `
      <tr>
        <td><span class="r-main">${escapeHtml(c.component_name)}</span></td>
        <td>
          <div class="r-main">${asm ? escapeHtml(asm.name) : '—'}</div>
          <div class="r-meta">${asm && asm.part_number ? 'NP ' + escapeHtml(asm.part_number) : ''}</div>
        </td>
        <td><input type="text" data-live-np="${c.id}" value="${escapeHtml(c.part_number || '')}"></td>
        <td><input type="number" step="any" data-live-qty="${c.id}" value="${c.quantity ?? 1}"></td>
        <td><input type="text" data-live-unit="${c.id}" value="${escapeHtml(c.unit || '')}" placeholder="Ej. pza"></td>
        <td><input type="number" step="any" data-live-cost="${c.id}" value="${c.unit_cost ?? ''}"></td>
        <td><input type="number" step="any" data-live-total="${c.id}" value="${c.total_cost ?? ''}"></td>
        <td>${providerSelectHtml('live-provider-' + c.id, c.provider_id || '')}</td>
        <td><input type="number" step="any" data-live-moq="${c.id}" value="${c.moq ?? ''}"></td>
        <td><input type="text" data-live-te="${c.id}" value="${escapeHtml(c.lead_time || '')}" placeholder="Ej. 15 días"></td>
        <td><input type="text" data-live-disp="${c.id}" value="${escapeHtml(c.availability || '')}" placeholder="Ej. 3 en stock"></td>
        <td><select data-live-status="${c.id}">${componentStatusOptionsHtml(c.status)}</select></td>
        <td><input type="text" data-live-po="${c.id}" value="${escapeHtml(c.po_number_component || '')}" placeholder="OC-..."></td>
        <td><input type="date" data-live-date="${c.id}" value="${c.supplier_commitment_date || ''}"></td>
        <td>
          ${asm ? `<a class="qa" data-open-asm="${asm.id}">Ver ensamble</a>` : ''}
          ${currentRole === 'admin' ? `<a class="qa danger" data-quick-remove="${c.id}">Quitar</a>` : ''}
        </td>
      </tr>
    `;
    }).join('');

    list.forEach(c => {
      body.querySelector(`[data-live-np="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'part_number', e.target.value.trim() || null));
      body.querySelector(`[data-live-qty="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'quantity', Number(e.target.value) || 0));
      body.querySelector(`[data-live-unit="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'unit', e.target.value.trim() || null));
      body.querySelector(`[data-live-cost="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'unit_cost', e.target.value === '' ? null : Number(e.target.value)));
      body.querySelector(`[data-live-total="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'total_cost', e.target.value === '' ? null : Number(e.target.value)));
      wireProviderSelect(body.querySelector(`[data-provider-field="live-provider-${c.id}"]`), (id) => { updateComponentField(c.id, 'provider_id', id); renderComprasTable(); });
      body.querySelector(`[data-live-moq="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'moq', e.target.value === '' ? null : Number(e.target.value)));
      body.querySelector(`[data-live-te="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'lead_time', e.target.value.trim() || null));
      body.querySelector(`[data-live-disp="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'availability', e.target.value.trim() || null));
      body.querySelector(`[data-live-status="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'status', e.target.value));
      body.querySelector(`[data-live-po="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'po_number_component', e.target.value.trim() || null));
      body.querySelector(`[data-live-date="${c.id}"]`).addEventListener('change', e => updateComponentField(c.id, 'supplier_commitment_date', e.target.value || null));
      const asm = c.portal_assemblies;
      const openLink = asm ? body.querySelector(`[data-open-asm="${asm.id}"]`) : null;
      if (openLink) openLink.addEventListener('click', () => { activeTab = 'ensambles'; openAssemblyId = asm.id; showingNewAssemblyForm = false; renderShell(); });
      const removeLink = body.querySelector(`[data-quick-remove="${c.id}"]`);
      if (removeLink) removeLink.addEventListener('click', () => quickRemoveComponent(c.id));
    });
  }

  function renderComprasTableIfVisible() {
    if (document.getElementById('compTableWrap')) renderComprasTable();
  }

  async function quickRemoveComponent(componentId) {
    if (!confirm('¿Quitar este componente? Esta acción no se puede deshacer.')) return;
    const { error } = await supabaseClient.from('portal_assembly_components').delete().eq('id', componentId);
    if (!error) {
      componentsCache = componentsCache.filter(c => c.id !== componentId);
      renderComprasTable();
      renderAssembliesList();
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'portal.html';
  });

  init();
</script>

</body>
</html>
