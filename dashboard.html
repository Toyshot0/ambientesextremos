<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Proyectos — AMBIENTES EXTREMOS</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="main.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .dash-header { padding: 32px 48px 24px; border-bottom: 1px solid var(--gunmetal-700); display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
  .dash-header h1 { font-size: 28px; font-weight: 600; margin-bottom: 6px; }
  .dash-header .sub { font-size: 14px; color: var(--steel-300); }
  .logout-btn { background: transparent; border: 1px solid var(--gunmetal-600); color: var(--steel-100); font-family: 'Oswald', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; padding: 10px 18px; border-radius: 3px; cursor: pointer; }
  .logout-btn:hover { border-color: var(--orange); color: var(--orange); }

  .dash-content { padding: 32px 48px 64px; max-width: 900px; }
  .empty-state { text-align: center; padding: 80px 24px; color: var(--steel-300); }

  .project-card { background: var(--gunmetal-800); border: 1px solid var(--gunmetal-700); border-radius: 6px; margin-bottom: 20px; overflow: hidden; }
  .project-head { padding: 22px 26px; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; cursor: pointer; }
  .project-name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .project-desc { font-size: 13px; color: var(--steel-300); }
  .status-badge { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 14px; border-radius: 20px; background: var(--orange-dim); border: 1px solid var(--orange); color: var(--orange); white-space: nowrap; }

  .timeline { padding: 0 26px 24px; border-top: 1px solid var(--gunmetal-700); margin-top: 4px; display: none; }
  .timeline.open { display: block; }
  .timeline-item { display: flex; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--gunmetal-700); }
  .timeline-item:last-child { border-bottom: none; }
  .timeline-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); margin-top: 5px; flex-shrink: 0; }
  .timeline-body .tstatus { font-size: 14px; font-weight: 600; color: var(--white); margin-bottom: 3px; }
  .timeline-body .tnote { font-size: 13px; color: var(--steel-100); margin-bottom: 3px; }
  .timeline-body .tdate { font-size: 11px; color: var(--steel-300); }

  .toggle-hint { font-size: 12px; color: var(--steel-300); margin-top: 6px; }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">AMBIENTES <span>EXTREMOS</span></a>
  <nav>
    <ul>
      <li><a href="sensores.html">Sensores</a></li>
      <li><a href="cables.html">Cables</a></li>
      <li><a href="ensambles.html">Ensambles</a></li>
      <li><a href="protecciones.html">Protecciones</a></li>
      <li><a href="index.html#contacto">Contacto</a></li>
    </ul>
  </nav>
</header>

<div class="dash-header">
  <div>
    <h1>Mis Proyectos</h1>
    <p class="sub" id="clientName">Cargando...</p>
  </div>
  <button class="logout-btn" id="logoutBtn">Cerrar sesión</button>
</div>

<div class="dash-content" id="dashContent">
  <p style="color:var(--steel-300);">Cargando sus proyectos...</p>
</div>

<script src="portal-config.js"></script>
<script>
  const dashContent = document.getElementById('dashContent');
  const clientNameEl = document.getElementById('clientName');

  async function init() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'portal.html';
      return;
    }

    const userId = session.user.id;

    const { data: client } = await supabaseClient
      .from('portal_clients')
      .select('company_name, contact_name')
      .eq('id', userId)
      .single();

    clientNameEl.textContent = client ? `${client.company_name}${client.contact_name ? ' — ' + client.contact_name : ''}` : session.user.email;

    const { data: portal_projects, error } = await supabaseClient
      .from('portal_projects')
      .select('id, name, description, current_status, portal_project_updates(id, status_label, note, created_at)')
      .eq('client_id', userId)
      .order('created_at', { ascending: false });

    if (error || !portal_projects || portal_projects.length === 0) {
      dashContent.innerHTML = '<div class="empty-state">Todavía no hay proyectos registrados a su nombre.</div>';
      return;
    }

    dashContent.innerHTML = '';
    portal_projects.forEach((project) => {
      const updates = (project.portal_project_updates || []).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

      const card = document.createElement('div');
      card.className = 'project-card';

      const head = document.createElement('div');
      head.className = 'project-head';
      head.innerHTML = `
        <div>
          <div class="project-name">${escapeHtml(project.name)}</div>
          <div class="project-desc">${escapeHtml(project.description || '')}</div>
          <div class="toggle-hint">Clic para ver historial ▾</div>
        </div>
        <span class="status-badge">${escapeHtml(project.current_status)}</span>
      `;

      const timeline = document.createElement('div');
      timeline.className = 'timeline';
      if (updates.length === 0) {
        timeline.innerHTML = '<p style="color:var(--steel-300); font-size:13px; padding-top:16px;">Sin actualizaciones registradas todavía.</p>';
      } else {
        timeline.innerHTML = updates.map(u => `
          <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-body">
              <div class="tstatus">${escapeHtml(u.status_label)}</div>
              ${u.note ? `<div class="tnote">${escapeHtml(u.note)}</div>` : ''}
              <div class="tdate">${new Date(u.created_at).toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
            </div>
          </div>
        `).join('');
      }

      head.addEventListener('click', () => timeline.classList.toggle('open'));

      card.appendChild(head);
      card.appendChild(timeline);
      dashContent.appendChild(card);
    });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'portal.html';
  });

  init();
</script>

</body>
</html>
